<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="description" content="Create, save, write, and read custom Finnish rune alphabets in the browser." />
  <meta property="og:title" content="EmuuRunes" />
  <meta property="og:description" content="Create, save, write, and read custom Finnish rune alphabets in the browser." />
  <meta property="og:type" content="website" />
  <title>EmuuRunes</title>
  <link rel="preload" href="styles/common.css" as="style" />
  <link rel="preload" href="styles/rune-writer.css" as="style" />
  <link rel="preload" href="scripts/rune-writer.js" as="script" />
  <link rel="stylesheet" href="styles/common.css" />
  <link rel="stylesheet" href="styles/rune-writer.css" />
</head>
<body>
  <header>
    <a class="home-link" href="index.html" aria-label="Back to tool index"></a>
    <h1>EmuuRunes</h1>
  </header>

  <main>
    <section>
      <h2>Construct a rune</h2>
      <div class="builder-wrap">
        <svg id="builder" viewBox="0 0 300 300" aria-label="Rune builder"></svg>

        <div class="letter-row">
          <label for="letters">Letter(s)</label>
          <input id="letters" class="letter-input" placeholder="A, Ä or AA, A" />
          <button id="saveRune" class="primary">Save rune</button>
        </div>

        <div class="actions">
          <button id="clearDrawing">Clear drawing</button>
          <button id="deleteRune" class="danger">Delete selected</button>
          <button id="exportData">Export JSON</button>
          <label>
            <input id="importData" type="file" accept="application/json" hidden />
            <button type="button" id="importButton">Import JSON</button>
          </label>
        </div>

        <div id="status" class="status"></div>
      </div>

      <p class="help">
        Allowed strokes: the outer rectangle sides, neighboring edge-middle connections around the diamond, and edge-middle-to-center spokes. Click a stroke again to remove it.
      </p>
    </section>

    <div class="grid-right">
      <section>
        <h2>Rune alphabet</h2>
        <div id="alphabet" class="alphabet"></div>
      </section>

      <section>
        <h2>Text to Runes</h2>
        <textarea id="textInput" placeholder="Type Finnish text here, e.g. TÄMÄ ON RUNOKIRJOITUS"></textarea>
        <div class="write-controls">
          <button id="renderText" class="good">Translate</button>
          <button id="clearText">Clear text</button>
          <label>
            Matching
            <select id="matchingMode">
              <option value="longest">prefer two-letter runes</option>
              <option value="single">single letters only</option>
            </select>
          </label>
        </div>
        <div id="output" class="output" aria-label="Rune output"></div>
      </section>

      <section>
        <h2>Runes to Text</h2>
        <div class="read-controls">
          <button id="addCurrentRune" class="good">Add current rune</button>
          <button id="addTripletBreak">End triplet</button>
          <button id="addSpaceRune">Add space</button>
          <button id="undoReadRune">Undo</button>
          <button id="clearReadRunes">Clear</button>
          <label>
            <input id="plainReadText" type="checkbox" />
            Text only
          </label>
        </div>
        <div id="readSequence" class="output read-output" aria-label="Selected rune sequence"></div>
        <textarea id="readText" class="read-text" readonly placeholder="Selected runes will decode here"></textarea>
      </section>
    </div>
  </main>

  <script src="scripts/rune-writer.js" defer></script>
</body>
</html>
